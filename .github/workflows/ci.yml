name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is absent because the package manager itself requires Node
        # 22.13 or later, not because the packages do. Testing on a
        # toolchain nobody runs would be testing something else.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # No version pin: the action reads packageManager from package.json,
      # so continuous integration cannot drift from the local toolchain. A
      # hardcoded 9 could not read overrides from pnpm-workspace.yaml, which
      # is a pnpm 10 feature, and every install failed on a config mismatch.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the server package typechecks against the core
      # package's emitted declarations, so a fresh checkout has nothing
      # to resolve against until they exist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # server.mjs is one of the two documented install paths and is committed,
      # so a bundle that drifts from source is what a cloner silently gets. The
      # frozen lockfile is what makes the comparison meaningful: without it a
      # transitive dependency bump alone produces a diff.
      - name: Bundles match source
        if: matrix.node == 22
        run: |
          pnpm bundle
          if ! git diff --exit-code -- server.mjs server-http.mjs; then
            echo "The committed bundles do not match the current source."
            echo "Run 'pnpm bundle' and commit the result."
            exit 1
          fi
